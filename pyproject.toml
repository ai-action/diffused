[project]
name = "diffused"
version = "1.0.2"
description = "Generate images with diffusion models."
requires-python = ">=3.10"
dependencies = [
    "accelerate>=1.14.0",
    "diffusers>=0.39.0",
    "torch>=2.13.0",
    "transformers>=5.14.0",
]
authors = [
    { name="Mark", email="mark@remarkablemark.org" },
]
maintainers = [
    { name="Mark", email="mark@remarkablemark.org" },
]
readme = "README.md"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "ai",
    "artificial intelligence",
    "cli",
    "diffusers",
    "diffusion",
    "image-to-image",
    "inpainting",
    "machine learning",
    "pytorch",
    "stable diffusion",
    "text-to-image",
]

[project.scripts]
diffused = "diffused.cli:main"

[project.entry-points."pipx.run"]
diffused = "diffused.cli:main"

[dependency-groups]
build = [
    "build==1.5.0",
    "pyinstaller==6.22.2",
]
docs = [
    "pdoc==16.0.0",
]
lint = [
    "black==26.5.1",
    "isort==9.0.1",
    "pre-commit==4.6.2",
    "ruff==0.16.4",
]
test = [
    "coverage==7.15.4",
    "pytest==9.1.1",
]

[project.urls]
Homepage = "https://github.com/ai-action/diffused"
Documentation = "https://ai-action.github.io/diffused/"
Repository = "https://github.com/ai-action/diffused"
Issues = "https://github.com/ai-action/diffused/issues"
Changelog = "https://github.com/ai-action/diffused/blob/master/CHANGELOG.md"

[tool.black]
fast = true

[tool.coverage.run]
omit = [
    # omit pytorch-generated files in /tmp
    "/tmp/*",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
